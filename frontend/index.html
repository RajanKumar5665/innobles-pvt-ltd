<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/innobles_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Innobles — Smart Software, Mobile & AI Solutions</title>
    <meta
      name="description"
      content="Innobles Smart Technologies Pvt. Ltd. builds web platforms, mobile apps, cloud infrastructure and AI-driven systems for businesses that want to move faster."
    />
    <meta name="keywords" content="web development, mobile apps, AI, cloud, DevOps, software company, Kolkata, India" />
    <meta name="author" content="Innobles Smart Technologies Pvt. Ltd." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.innobles.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Innobles" />
    <meta property="og:title" content="Innobles — Smart Software, Mobile & AI Solutions" />
    <meta
      property="og:description"
      content="Web platforms, mobile apps, cloud and AI-driven systems built for businesses that want to move faster."
    />
    <meta property="og:url" content="https://www.innobles.in/" />
    <meta property="og:image" content="/hero-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Innobles — Smart Software, Mobile & AI Solutions" />
    <meta
      name="twitter:description"
      content="Web platforms, mobile apps, cloud and AI-driven systems built for businesses that want to move faster."
    />

    <!-- Theme -->
    <meta name="theme-color" content="#172033" />

    <!-- Performance: give the browser the fastest path to the fonts + hero. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="image"
      href="/hero-image.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <!-- Non-blocking font load: starts async, only becomes blocking once applied. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
